[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo2prompt"
version = "0.2.0"
description = "Pack a repository into clean, AI-friendly context (directory tree + file contents + token stats)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "repo2prompt contributors" }]
keywords = ["ai", "llm", "context", "prompt", "repository", "cli", "git", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = ["pathspec>=0.11"]

[project.urls]
Homepage = "https://github.com/wshuainanhai/repo2prompt"
Repository = "https://github.com/wshuainanhai/repo2prompt"
Issues = "https://github.com/wshuainanhai/repo2prompt/issues"

[project.scripts]
repo2prompt = "repo2prompt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
targets = ["src"]
exclude = ["tests"]
