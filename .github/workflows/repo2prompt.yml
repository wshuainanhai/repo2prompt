# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow: repo2prompt — pack any repo into AI-friendly context
#
# Usage in a calling workflow:
#
#   jobs:
#     pack:
#       uses: wshuainanhai/repo2prompt/.github/workflows/repo2prompt.yml@main
#       with:
#         root: .                    # repo root to scan (default: .)
#         output: context.md         # output file (default: repo-context.md)
#         include: "*.py,*.yaml"     # comma-separated include globs
#         exclude: "*.pyc,__pycache__"  # comma-separated exclude globs
#         max_tokens: "8000"         # max tokens (default: 10000)
#         lang: "en"                 # CLI language (en/zh/ja/ko/fr/de)
#       secrets:
#         # optional: GitHub token for adding results as a PR comment
#         gh_token: ${{ secrets.GITHUB_TOKEN }}
#
# ─────────────────────────────────────────────────────────────────────────────

name: "📦 repo2prompt (reusable)"

on:
  workflow_call:
    inputs:
      root:
        description: "Repository root to scan"
        required: false
        default: "."
        type: string
      output:
        description: "Output filename"
        required: false
        default: "repo-context.md"
        type: string
      include:
        description: "Comma-separated include globs (e.g. '*.py,*.yaml')"
        required: false
        default: ""
        type: string
      exclude:
        description: "Comma-separated exclude globs"
        required: false
        default: ""
        type: string
      max_tokens:
        description: "Soft max token limit"
        required: false
        default: "10000"
        type: string
      lang:
        description: "CLI language (en/zh/ja/ko/fr/de)"
        required: false
        default: "en"
        type: string
      fail_on_empty:
        description: "Fail if no files are included"
        required: false
        default: "false"
        type: string
    secrets:
      gh_token:
        description: "GitHub token (for PR comments)"
        required: false

jobs:
  pack:
    name: Pack repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repo2prompt
        run: pip install repo2prompt

      - name: Pack repository
        id: pack
        run: |
          ROOT="${{ inputs.root }}"
          OUTPUT="${{ inputs.output }}"
          
          # Build the command
          CMD="python -m repo2prompt $ROOT -o $OUTPUT --no-gitignore"
          
          # Add include flags
          if [ -n "${{ inputs.include }}" ]; then
            IFS=',' read -ra GLOBS <<< "${{ inputs.include }}"
            for g in "${GLOBS[@]}"; do
              CMD="$CMD --include $(echo $g | xargs)"
            done
          fi
          
          # Add exclude flags
          if [ -n "${{ inputs.exclude }}" ]; then
            IFS=',' read -ra GLOBS <<< "${{ inputs.exclude }}"
            for g in "${GLOBS[@]}"; do
              CMD="$CMD --exclude $(echo $g | xargs)"
            done
          fi
          
          # Add max tokens
          CMD="$CMD --max-tokens ${{ inputs.max_tokens }}"
          
          echo "Running: $CMD"
          eval $CMD
          
          if [ ! -s "$OUTPUT" ]; then
            echo "⚠️  Output file is empty"
            if [ "${{ inputs.fail_on_empty }}" = "true" ]; then
              exit 1
            fi
          fi
          
          echo "✅ Wrote $(wc -c < $OUTPUT) bytes to $OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-context
          path: ${{ inputs.output }}
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && secrets.gh_token != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.gh_token }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync(process.env.OUTPUT || 'repo-context.md', 'utf8');
            const summary = content.slice(0, 5000); // limit comment size
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 📦 repo2prompt\n\n<details><summary>Context preview (first 5000 chars)</summary>\n\n\`\`\`\n${summary}\n\`\`\`\n</details>\n\n_Full context attached as artifact._`
            });
